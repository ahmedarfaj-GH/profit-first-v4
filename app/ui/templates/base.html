<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Profit First{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <div class="brand">Profit First <span class="badge">Prototype</span></div>
    <nav>
      <a href="/hierarchy">الهرمية</a>
      <a href="/runs">كل العمليات</a>
      <a href="/logout">تسجيل الخروج ({{ user }})</a>
    </nav>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
